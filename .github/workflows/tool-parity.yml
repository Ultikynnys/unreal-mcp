name: tool-parity

# Enforce that the Python MCP tool layer and the C++ UnrealMCP plugin stay in sync:
# every command the Python tools send must have a handler in the C++ dispatch, every
# served command must be advertised, and the agent-facing docs must not name a tool,
# parameter or file that does not exist.
#
# CI runs the SAME battery as the local pre-push hook (Python/scripts/run_checks.py),
# so the two gates cannot drift apart. See Docs/ops/pre-push-checks.md.
#
# The dependencies must be installed: two checks import the tool modules, which import
# mcp.server.fastmcp, so a bare interpreter fails with ModuleNotFoundError. That is why this
# workflow used to run only the parity checker, which parses source without importing it.

on:
  push:
    paths:
      - "Python/**"
      - "MCPGameProject/Plugins/UnrealMCP/Source/**"
      - ".githooks/**"
      - ".github/workflows/tool-parity.yml"
  pull_request:
    paths:
      - "Python/**"
      - "MCPGameProject/Plugins/UnrealMCP/Source/**"
      - ".githooks/**"
      - ".github/workflows/tool-parity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    name: Python <-> C++ parity and hygiene battery
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install the Python dependencies from the lock
        run: uv sync --project Python --locked

      - name: Run the check battery
        # The runner's own unit test is part of the battery, so it reports a broken checker
        # as such rather than as a false failure of the tree.
        run: uv run --project Python python Python/scripts/run_checks.py
